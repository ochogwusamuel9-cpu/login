<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CV Match AI{% endblock %}</title>
  <script>
    (function () {
      const savedTheme = localStorage.getItem("cv_match_theme");
      if (savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-surface: #ffffff;
      --bg-subtle: #f8f7fa;
      --text-main: #0a0a0b;
      --text-muted: #4b5563;
      --border-color: #e5e7eb;
      --accent: #CB5DF1;
      --accent-hover: #b842df;
      --accent-text: #0a0a0b;
      --accent-soft: rgba(203, 93, 241, 0.14);
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
    }

    [data-theme="dark"] {
      --bg-main: #0a0a0b;
      --bg-surface: #131316;
      --bg-subtle: #1a1a1f;
      --text-main: #ffffff;
      --text-muted: #b3b3bd;
      --border-color: #26262e;
      --accent: #CB5DF1;
      --accent-hover: #d87df7;
      --accent-text: #0a0a0b;
      --accent-soft: rgba(203, 93, 241, 0.18);
      --danger-bg: rgba(153, 27, 27, 0.22);
      --danger-border: rgba(248, 113, 113, 0.45);
      --danger-text: #fecaca;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.875rem 1.25rem;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background-color: var(--accent);
      display: inline-block;
    }

    .auth-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
    }

    .user-badge {
      font-size: 0.875rem;
      color: var(--text-main);
      background-color: var(--accent-soft);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-weight: 500;
    }

    .logout-form {
      margin: 0;
    }

    .btn {
      display: inline-block;
      padding: 0.52rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .page-shell {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    @media (min-width: 768px) {
      .page-shell {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="{% url 'matcher:dashboard' %}" class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>CV Match AI</span>
    </a>

    <nav class="auth-bar" aria-label="Account navigation">
      <button type="button" id="theme-toggle" class="btn btn-ghost" aria-pressed="false">
        Dark mode
      </button>

      {% if user.is_authenticated %}
        <span class="user-badge">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'register' %}" class="btn btn-ghost">Create account</a>
        <a href="{% url 'login' %}" class="btn">Log in</a>
      {% endif %}
    </nav>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      const toggleBtn = document.getElementById("theme-toggle");
      const root = document.documentElement;

      function syncButtonLabel() {
        const isDark = root.getAttribute("data-theme") === "dark";
        toggleBtn.textContent = isDark ? "Light mode" : "Dark mode";
        toggleBtn.setAttribute("aria-pressed", String(isDark));
      }

      syncButtonLabel();

      toggleBtn.addEventListener("click", function () {
        const isDark = root.getAttribute("data-theme") === "dark";
        if (isDark) {
          root.removeAttribute("data-theme");
          localStorage.setItem("cv_match_theme", "light");
        } else {
          root.setAttribute("data-theme", "dark");
          localStorage.setItem("cv_match_theme", "dark");
        }
        syncButtonLabel();
      });
    })();
  </script>
</body>
</html>
